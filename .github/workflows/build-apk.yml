# Compila o APK de release do LANCE! e publica na aba Releases do GitHub.
name: Gerar APK do LANCE!

on:
  push:
    paths:
      - 'lance/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Testes
        run: flutter test

      - name: Compilar APK de release (um por tipo de processador, bem menores)
        run: flutter build apk --release --split-per-abi

      - name: Renomear APKs
        run: |
          # LANCE.apk = celulares atuais (ARM 64 bits, quase todos os Android de hoje)
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/LANCE.apk
          # Para celulares antigos (32 bits)
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/LANCE-celular-antigo.apk

      - name: Guardar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: LANCE-apk
          path: |
            lance/build/LANCE.apk
            lance/build/LANCE-celular-antigo.apk

      - name: Publicar na aba Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: LANCE! (build ${{ github.run_number }})
          body: |
            APK do LANCE! gerado automaticamente.
            Baixe o LANCE.apk abaixo, abra no celular e toque em Instalar
            (permita "instalar apps desconhecidos" se o Android pedir).
            Se o celular for muito antigo e o LANCE.apk nao instalar, use o LANCE-celular-antigo.apk.
          files: |
            lance/build/LANCE.apk
            lance/build/LANCE-celular-antigo.apk
          target_commitish: ${{ github.sha }}
